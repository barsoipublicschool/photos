<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Interactive Photo Gallery</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .config-container {
            max-width: 800px;
            margin: 25px auto 10px auto;
            padding: 0 20px;
            width: 100%;
        }

        .input-group {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 10px;
            font-size: 0.95rem;
        }

        .input-group button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .input-group button:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        .status-msg {
            text-align: center;
            margin: 30px 20px;
            font-size: 1.1rem;
            color: var(--text-sub);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            padding: 30px 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .gallery-card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
            aspect-ratio: 4/3;
        }

        .gallery-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px -10px rgba(56, 189, 248, 0.3);
            border-color: var(--accent);
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Lightbox CSS */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 35px;
            color: #fff;
            font-size: 35px;
            cursor: pointer;
            font-weight: 300;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--accent);
        }

        @media (max-width: 600px) {
            header { padding: 15px; }
            .gallery { padding: 15px; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .input-group { flex-direction: column; }
            .input-group button { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🖼️ Google Drive Photo Gallery</h1>
        <p>Poore Drive folder ke photos ek saath dekhein</p>
    </header>

    <div class="config-container">
        <div class="input-group">
            <input type="text" id="scriptUrlInput" placeholder="Apna Google Apps Script Web App URL yahan paste karein...">
            <button onclick="loadGallery()">Gallery Load Karein</button>
        </div>
    </div>

    <div id="status" class="status-msg">Upar Apps Script ka Web App URL dalkar "Gallery Load Karein" par click karein.</div>

    <div class="gallery" id="galleryContainer"></div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img src="" id="lightboxImg" class="lightbox-img" alt="Enlarged View">
    </div>

    <script>
        function loadGallery() {
            const url = document.getElementById("scriptUrlInput").value.trim();
            const status = document.getElementById("status");
            const gallery = document.getElementById("galleryContainer");

            if (!url) {
                alert("Kripya sahi Web App URL daalein!");
                return;
            }

            status.style.display = "block";
            status.innerText = "Photos fetch ho rahi hain... Kripya intezar karein.";
            gallery.innerHTML = "";

            fetch(url)
                .then(res => res.json())
                .then(ids => {
                    if (!ids || ids.length === 0) {
                        status.innerText = "Is folder mein koi photo nahi mili ya Access Permission restricted hai.";
                        return;
                    }

                    status.style.display = "none";

                    ids.forEach(id => {
                        const card = document.createElement("div");
                        card.className = "gallery-item gallery-card";

                        const img = document.createElement("img");
                        const imgSrc = `https://lh3.googleusercontent.com/d/${id}`;
                        img.src = imgSrc;
                        img.alt = "Drive Photo";
                        img.loading = "lazy";

                        img.onerror = function() {
                            this.src = "https://via.placeholder.com/400x300?text=Photo+Access+Denied";
                        };

                        card.onclick = () => openLightbox(imgSrc);

                        card.appendChild(img);
                        gallery.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error(err);
                    status.innerText = "Photos load karne mein error aaya. Kripya URL aur Google Script Deployment Permissions check karein.";
                });
        }

        function openLightbox(src) {
            const lightbox = document.getElementById("lightbox");
            const lightboxImg = document.getElementById("lightboxImg");
            lightboxImg.src = src;
            lightbox.classList.add("active");
        }

        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("active");
        }
    </script>
</body>
</html>
