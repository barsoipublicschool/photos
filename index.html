<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header class="navbar">
        <div class="logo"><i class="fa-solid fa-camera-retro"></i> My Gallery</div>
        <button id="theme-toggle" class="theme-btn"><i class="fa-solid fa-moon"></i></button>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Moments Captured</h1>
        <p>Explore high-quality photos directly synced from Google Drive</p>
    </section>

    <!-- Filter Buttons -->
    <div class="filter-container" id="filter-buttons">
        <button class="filter-btn active" data-category="all">All</button>
    </div>

    <!-- Photo Grid -->
    <main class="gallery-container">
        <div class="gallery-grid" id="gallery-grid">
            <!-- Dynamic Images will be inserted here -->
        </div>
        <div id="loader" class="loader">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="" alt="">
        <div class="lightbox-caption" id="lightbox-caption"></div>
        <a id="download-btn" class="download-btn" href="#" target="_blank" download><i class="fa-solid fa-download"></i> Download Original</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
