<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Photo Gallery</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-nav {
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .img-hover {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gallery-item:hover .img-hover {
            transform: scale(1.08);
        }

        .skeleton {
            background: linear-gradient(90deg, #1f2937 25%, #374151 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass-nav">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-camera-retro text-white text-xl"></i>
                </div>
                <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">Photo Gallery</span>
            </div>
            <div id="photo-count" class="text-sm font-medium text-gray-400 glass-card px-4 py-1.5 rounded-full">
                Loading...
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="max-w-7xl mx-auto px-6 pt-10 pb-4 text-center">
        <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-3">
            Photo <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-pink-500">Portfolio</span>
        </h1>
        <p class="text-gray-400 text-sm md:text-base">Powered Live Gallery</p>
    </section>

    <!-- Filter Buttons -->
    <section class="max-w-7xl mx-auto px-6 mb-8 w-full">
        <div id="filter-container" class="flex flex-wrap justify-center gap-2"></div>
    </section>

    <!-- Main Gallery Section -->
    <main class="max-w-7xl mx-auto px-6 flex-grow w-full mb-16">
        <!-- Skeleton Loaders -->
        <div id="skeleton-loader" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="h-64 rounded-2xl skeleton"></div>
            <div class="h-64 rounded-2xl skeleton"></div>
            <div class="h-64 rounded-2xl skeleton"></div>
            <div class="h-64 rounded-2xl skeleton"></div>
        </div>

        <!-- Real Gallery Grid -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden"></div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex-col justify-center items-center p-4">
        <button id="close-lightbox" class="absolute top-6 right-6 text-white/70 hover:text-white text-3xl transition-all">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="relative max-w-4xl w-full flex flex-col items-center">
            <img id="lightbox-img" class="max-h-[80vh] max-w-full object-contain rounded-xl shadow-2xl" src="" alt="">
            <div class="mt-4 text-center">
                <h3 id="lightbox-title" class="text-xl font-semibold text-white"></h3>
                <span id="lightbox-category" class="inline-block mt-2 px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-indigo-300"></span>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ यहाँ अपना Web App URL डालें
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydUq-nG8_ScNSF2P3-NCJG7DnFiUbok-OXVjivawIU5J04-DSSXWYs6rtvj0TlchMD/exec";

        let allPhotos = [];

        document.addEventListener('DOMContentLoaded', fetchPhotos);

        async function fetchPhotos() {
            const skeleton = document.getElementById('skeleton-loader');
            const grid = document.getElementById('gallery-grid');

            try {
                const response = await fetch(APP_SCRIPT_URL);
                const data = await response.json();
                
                allPhotos = data.filter(item => item.file_id);
                
                skeleton.classList.add('hidden');
                grid.classList.remove('hidden');
                
                document.getElementById('photo-count').innerText = `${allPhotos.length} Photos Loaded`;

                renderFilters();
                renderGallery(allPhotos);

            } catch (error) {
                console.error("Error fetching photos:", error);
                skeleton.innerHTML = "<p class='col-span-full text-center text-red-400'>डेटा लोड करने में समस्या आई। कृपया URL चेक करें।</p>";
            }
        }

        // Google Drive Thumbnail Proxy URLs (2 Level Fallback)
        function getDriveImageUrls(fileId) {
            return [
                `https://lh3.googleusercontent.com/d/${fileId}=s1000`,
                `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`
            ];
        }

        function renderGallery(photos) {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            photos.forEach(photo => {
                const title = photo.title || 'Untitled';
                const category = photo.category || 'General';
                const [primaryUrl, fallbackUrl] = getDriveImageUrls(photo.file_id);

                const card = document.createElement('div');
                card.className = 'gallery-item group cursor-pointer glass-card rounded-2xl overflow-hidden flex flex-col relative';
                
                card.innerHTML = `
                    <div class="relative h-64 overflow-hidden bg-gray-900">
                        <img src="${primaryUrl}" alt="${title}" loading="lazy" 
                             class="w-full h-full object-cover img-hover"
                             onerror="if (this.src !== '${fallbackUrl}') { this.src='${fallbackUrl}'; } else { this.onerror=null; this.src='https://via.placeholder.com/400x300/1e293b/94a3b8?text=Private+Drive+Image'; }">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                            <span class="text-xs font-semibold uppercase tracking-wider text-indigo-400 bg-indigo-950/80 px-2.5 py-1 rounded-md border border-indigo-500/30">${category}</span>
                        </div>
                    </div>
                    <div class="p-4 flex flex-col justify-between flex-grow">
                        <h3 class="font-semibold text-gray-200 group-hover:text-indigo-400 transition-colors line-clamp-1">${title}</h3>
                    </div>
                `;

                card.addEventListener('click', () => openLightbox(primaryUrl, title, category));
                grid.appendChild(card);
            });
        }

        function renderFilters() {
            const categories = ['all', ...new Set(allPhotos.map(p => p.category).filter(Boolean))];
            const filterContainer = document.getElementById('filter-container');
            filterContainer.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                const isAll = cat === 'all';
                
                btn.className = `filter-btn px-5 py-2 rounded-full text-sm font-semibold transition-all duration-300 ${
                    isAll 
                    ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
                    : 'glass-card text-gray-400 hover:text-white hover:bg-white/10'
                }`;
                btn.innerText = cat.charAt(0).toUpperCase() + cat.slice(1);
                
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.className = 'filter-btn px-5 py-2 rounded-full text-sm font-semibold transition-all duration-300 glass-card text-gray-400 hover:text-white hover:bg-white/10';
                    });
                    e.target.className = 'filter-btn px-5 py-2 rounded-full text-sm font-semibold transition-all duration-300 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30';

                    if (cat === 'all') {
                        renderGallery(allPhotos);
                    } else {
                        const filtered = allPhotos.filter(p => p.category && p.category.toLowerCase() === cat.toLowerCase());
                        renderGallery(filtered);
                    }
                });

                filterContainer.appendChild(btn);
            });
        }

        function openLightbox(url, title, category) {
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-title').innerText = title;
            document.getElementById('lightbox-category').innerText = category;
            
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
        }

        document.getElementById('close-lightbox').addEventListener('click', () => {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
        });

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') {
                e.target.classList.add('hidden');
                e.target.classList.remove('flex');
            }
        });
    </script>
</body>
</html>
